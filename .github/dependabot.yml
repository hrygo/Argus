version: 2

updates:
  # Actions 已按 commit SHA 固定，版本升级只能由 Dependabot 完成（人工改 tag 会破坏固定策略）。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/services/console"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "console"

  - package-ecosystem: "docker"
    directory: "/services/eval-runner"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/services/console"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/services/demo-agent"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/deploy/langfuse"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "pip"
    directory: "/services/eval-runner"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
  - package-ecosystem: "pip"
    directory: "/services/demo-agent"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
